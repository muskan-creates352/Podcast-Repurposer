version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./podcast_repurposer.db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-supersecretproductionkey12345}
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_db:
